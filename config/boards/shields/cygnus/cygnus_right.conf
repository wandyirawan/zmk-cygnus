# enable deep sleep support
CONFIG_ZMK_SLEEP=y

# the keyboard disconnects from bluetooth.
# uses very little power, but it may take
# a few seconds to reconnect after waking.
# 1.800.000 ms = 30 minutes
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Bluetooth device name
CONFIG_ZMK_KEYBOARD_NAME="Cygnus"
# ZMK implies BT_DEVICE_NAME_DYNAMIC + BT_SETTINGS, so the runtime BLE name
# persists in NVS and survives reflashes (stale "Corne" kept loading on boot).
# Disable the dynamic name so the compiled CONFIG_BT_DEVICE_NAME ("Cygnus")
# is always used and the persisted value is ignored.
CONFIG_BT_DEVICE_NAME_DYNAMIC=n
